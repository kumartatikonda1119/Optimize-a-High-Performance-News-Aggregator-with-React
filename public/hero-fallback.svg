<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" role="img" aria-labelledby="title desc">
  <title id="title">AetherLens hero fallback</title>
  <desc id="desc">Abstract gradient background used when no article image is available.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="50%" stop-color="#1b263b" />
      <stop offset="100%" stop-color="#341b3d" />
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#7bdff6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7bdff6" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1040" height="720" fill="url(#bg)" />
  <rect width="1040" height="720" fill="url(#glow)" />
  <g fill="#ffffff" fill-opacity="0.75" font-family="Segoe UI, Arial, sans-serif">
    <text x="80" y="360" font-size="42" font-weight="600">AetherLens</text>
    <text x="80" y="410" font-size="20" letter-spacing="4">LIVE NEWS BRIEF</text>
  </g>
</svg>
